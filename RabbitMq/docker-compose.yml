version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: droidguard-rabbit
    ports:
      # AMQP port
      - "5672:5672"
      # Management UI port
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      # To not lose queues on restart
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data: